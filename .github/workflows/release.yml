name: Release

# Push a tag like v0.2.0 (matching package.json) to publish to npm.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs a recent npm CLI.
      - run: npm install -g npm@latest
      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm run smoke
      # prepublishOnly runs typecheck, tests and a fresh build.
      - run: npm publish --access public
        env:
          # Only needed if trusted publishing isn't set up for this package on npmjs.com.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
