openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
servers:
  - url: "{scheme}://api.petstore.test/v1"
    variables:
      scheme: { default: https }
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      tags: [pets]
      parameters:
        - { name: limit, in: query, schema: { type: integer, format: int32 } }
      responses:
        "200":
          description: A page of pets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pet" }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createPet
      summary: Create a pet
      tags: [pets]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
              examples:
                cat: { summary: A cat, value: { id: 1, name: Tom, tag: cat, owner: null } }
                dog: { $ref: "#/components/examples/Dog" }
        "422":
          description: Invalid pet
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
  /pets/{pet-id}:
    get:
      operationId: showPetById
      tags: [pets]
      responses:
        "200":
          description: The pet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        "404":
          description: Not found
          content:
            application/json:
              example: { code: 404, message: no such pet }
    delete:
      operationId: deletePet
      responses:
        "204": { description: Deleted }
  /pets/{petId}/photo.{format}:
    get:
      operationId: petPhoto
      responses:
        "200":
          description: Photo
          content:
            image/png: { schema: { type: string, format: binary } }
  /categories:
    get:
      operationId: listCategories
      responses:
        "2XX":
          description: Category tree
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string, example: Rex }
        tag: { type: string, enum: [dog, cat] }
        owner: { type: string, nullable: true }
        born: { type: string, format: date }
        weight: { type: number, minimum: 0, exclusiveMinimum: true }
    Category:
      type: object
      properties:
        name: { type: string }
        children:
          type: array
          items: { $ref: "#/components/schemas/Category" }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer }
        message: { type: string }
  responses:
    Error:
      description: Unexpected error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  examples:
    Dog:
      summary: A dog
      value: { id: 2, name: Rex, tag: dog }
